
# RecallR Model Configuration

application:
  name: RecallR
  environment: development

inference:
  device: cpu

embedding_model:
  model_id: sentence-transformers/all-MiniLM-L6-v2
  embedding_dimension: 384
  normalize_embeddings: true

classification_model:
  model_id: MoritzLaurer/xtremedistil-l6-h256-zeroshot-v1.1-all-33

  candidate_labels:
    - Technology
    - AI/ML
    - MLOps
    - DevOps
    - Programming
    - Research
    - Career
    - Finance
    - Personal
    - Education

  threshold: 0.5
  multi_label: true
