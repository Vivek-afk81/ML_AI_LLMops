
name: RecallR - CI/CD Pipeline

on:
  # Run tests whenever code is pushed to these branches
  push:
    branches:
      - main
      - feature/recallr

  # Validate pull requests targeting main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run RecallR Tests
    runs-on: ubuntu-latest

    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: ${{ runner.os }}-huggingface-recallr-v1
          restore-keys: |
            ${{ runner.os }}-huggingface-recallr-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

  build:
    name: Build and Publish Docker Image
    needs: test
    runs-on: ubuntu-latest

    # Publish only after tests pass on a push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
